# ============================================================================
# mola::mapper::Mapper: the global back end next to a front end (LIO) and its
# state estimator. Every setting can be changed with its environment variable.
#
# Used from a launch file as:
#   - name: mapper
#     type: mola::mapper::Mapper
#     raw_data_source: "dataset_input"   # GNSS and IMU readings
#     params: "../params/mapper.yaml"
# ============================================================================

params:
  # The map frame: the state estimator's reference frame.
  reference_frame_name: "${MOLA_TF_MAP|map}"

  # GNSS readings attached to the keyframes (regex of sensor labels; empty: none):
  gnss_sensor_labels_re: "${MOLA_MAPPER_GNSS_LABELS|gps}"
  gnss_max_time_offset: ${MOLA_MAPPER_GNSS_MAX_TIME_OFFSET|0.5}  # [s]

  # IMU whose averaged accelerometer levels the map (regex; empty: none):
  imu_sensor_labels_re: "${MOLA_MAPPER_GRAVITY_IMU_LABELS|}"
  imu_gravity_window: ${MOLA_MAPPER_GRAVITY_WINDOW|1.0}  # [s] before each keyframe
  imu_gravity_min_samples: 10

  # IMU whose gyroscope gives the rotation between consecutive keyframes (regex;
  # empty: none). Bias from a mola::ImuBiasSource (e.g. the state estimator with
  # MOLA_NAVSTATE_IMU_BIAS_TRACKING=true), else taken as zero with gyro_bias_sigma:
  gyro_sensor_labels_re: "${MOLA_MAPPER_GYRO_LABELS|}"
  gyro_noise_density: ${MOLA_MAPPER_GYRO_NOISE_DENSITY|3e-4}  # [rad/s/sqrt(Hz)]
  gyro_bias_sigma: 0.005  # [rad/s]
  gyro_scale_sigma: ${MOLA_MAPPER_GYRO_SCALE_SIGMA|0.005}
  gyro_max_gap: 0.1  # [s]

  graph:
    # LIO keyframe chain: stiff (the front end is locally accurate; only its slow
    # drift gives way to GNSS and loops). Sigmas: floor + random walk per sqrt(m):
    odometry_uncertainty_multiplier: ${MOLA_MAPPER_ODOM_SIGMA_MULTIPLIER|0.0}  # front end covariance (0: ignored)
    odometry_additional_noise_xyz: ${MOLA_MAPPER_ODOM_SIGMA_XYZ|0.002}          # [m]
    odometry_additional_noise_ang_deg: ${MOLA_MAPPER_ODOM_SIGMA_ANG|0.01}       # [deg]
    odometry_noise_xyz_per_sqrt_m: ${MOLA_MAPPER_ODOM_SIGMA_XYZ_PER_SQRT_M|0.01}
    odometry_noise_ang_deg_per_sqrt_m: ${MOLA_MAPPER_ODOM_SIGMA_ANG_PER_SQRT_M|0.05}
    # plus per radian turned (LiDAR odometry heading errors concentrate in turns):
    odometry_noise_ang_per_rad: ${MOLA_MAPPER_ODOM_SIGMA_ANG_PER_RAD|0.02}

    use_gyro: ${MOLA_MAPPER_USE_GYRO|true}
    gyro_min_sigma_deg: 0.02

    use_gnss: ${MOLA_MAPPER_USE_GNSS|true}
    gnss_minimum_uncertainty: ${MOLA_MAPPER_GNSS_MIN_SIGMA|0.5}  # [m]
    gnss_uncertainty_multiplier: ${MOLA_MAPPER_GNSS_SIGMA_MULTIPLIER|1.0}
    gnss_max_uncertainty_horiz: 20.0  # [m]
    gnss_robust_kernel: "${MOLA_MAPPER_GNSS_ROBUST_KERNEL|cauchy}"  # huber, cauchy, geman_mcclure, tukey
    gnss_robust_k: ${MOLA_MAPPER_GNSS_ROBUST_K|1.5}  # [sigmas]
    # The geo-reference is published once its azimuth sigma is below this:
    georef_max_sigma_yaw_deg: ${MOLA_MAPPER_GEOREF_MAX_SIGMA_YAW|10.0}  # [deg]

    use_imu_gravity: ${MOLA_MAPPER_USE_GRAVITY|true}
    imu_gravity_sigma_deg: ${MOLA_MAPPER_GRAVITY_SIGMA_DEG|3.0}

    loop_closure_robust_huber_k: 1.5
    loop_closure_min_sigma_xyz: ${MOLA_MAPPER_LC_MIN_SIGMA_XYZ|0.05}  # [m]
    loop_closure_min_sigma_ang_deg: ${MOLA_MAPPER_LC_MIN_SIGMA_ANG|0.25}  # [deg]

  enable_optimizer_thread: true
  optimizer_min_period: ${MOLA_MAPPER_OPTIMIZER_PERIOD|1.0}  # [s]

  # Fuse the optimized newest keyframe pose into the state estimator:
  feedback_to_state_estimator: ${MOLA_MAPPER_FEEDBACK|false}
  feedback_min_sigma_xyz: ${MOLA_MAPPER_FEEDBACK_MIN_SIGMA_XYZ|0.10}  # [m]
  feedback_min_sigma_ang_deg: ${MOLA_MAPPER_FEEDBACK_MIN_SIGMA_ANG|0.5}  # [deg]

  # Loop closure detection (mola_sm_loop_closure):
  loop_closure_enabled: ${MOLA_MAPPER_LOOP_CLOSURE|true}
  loop_closure_pipeline_file: "${MOLA_MAPPER_LC_PIPELINE|$(ros2 pkg prefix mola_mapper)/share/mola_mapper/params/loop-closure-f2f-mapper.yaml}"
  loop_closure_check_period_sec: ${MOLA_MAPPER_LC_PERIOD|5.0}  # [s]
  loop_closure_min_new_keyframes: 10
  loop_closure_incremental: true
  loop_closure_full_scan_every_n: 10
  loop_closure_finalize_rounds: ${MOLA_MAPPER_LC_FINALIZE_ROUNDS|4}

  # Outputs, written at the end (empty: not written):
  output_tum_trajectory: "${MOLA_MAPPER_OUTPUT_TUM|}"
  output_simplemap: "${MOLA_MAPPER_OUTPUT_SIMPLEMAP|}"
  output_georeference: "${MOLA_MAPPER_OUTPUT_GEOREF|}"
  output_loop_closures: "${MOLA_MAPPER_OUTPUT_LOOPS|}"
  output_state_estimator_tum: "${MOLA_MAPPER_OUTPUT_SE_TUM|}"
  output_state_estimator_georeference: "${MOLA_MAPPER_OUTPUT_SE_GEOREF|}"
  output_graph_input: "${MOLA_MAPPER_OUTPUT_GRAPH_INPUT|}"
