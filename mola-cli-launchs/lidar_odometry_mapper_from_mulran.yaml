# -----------------------------------------------------------------------------
#                        SLAM system definition for MOLA
# -----------------------------------------------------------------------------
# Integration validation: mola_mapper::Mapper acts as BOTH the
# `NavStateFilter` that `LidarOdometry` queries for short-term prediction
# (replacing mola_state_estimation_{simple,smoother}) AND the
# `SharedKeyframeMap` sink it pushes sparse central-map keyframes to.
#
# Unlike the KITTI launcher (lidar_odometry_mapper_from_kitti.yaml), the
# MulRan dataset also provides IMU (with absolute orientation quaternion +
# magnetometer) and GNSS (NMEA GGA), both labeled "imu"/"gps". This file wires
# `mapper` directly to `raw_data_source: dataset_input` so it receives
# those observations via onNewObservation()/fuse_imu()/fuse_gnss(), in
# addition to the sparse keyframes pushed by LidarOdometry through the
# SharedKeyframeMap sink.
#
# The mapper `params:` block below `$import`s the shared defaults from
# ../params/mapper-common.yaml and overrides ONLY the few MulRan-specific
# keys this launcher needs active out of the box (no env var required for a
# first run):
#   - estimate_geo_reference: true -- otherwise fuse_gnss() silently ignores
#     every GNSS reading (no fixed_geo_reference is assumed for an arbitrary
#     sequence, so it must be estimated live from GNSS+IMU instead).
#   - link_first_pose_to_reference_origin_sigma: 1e-6 -- REQUIRED whenever
#     estimating geo-referencing (see Parameters.h's doc), or the whole graph
#     is gauge-free (~1e6-sigma absolute poses) until GNSS+IMU lock in, and
#     LidarOdometry discards the motion model meanwhile ("Discarding motion
#     model ... due to large uncertainty"), starving the local map and the
#     SharedKeyframeMap sink of updates.
#   - convergence_max_position_sigma: 1.5 -- MulRan's GNSS noise floors the
#     geo-ref position sigma at ~1.1 m, so the common 1.0 m gate never latches.
#
# No GUI module here on purpose (headless, for quick/automatable validation
# runs). Add a `viz: mola::MolaViz` module block (see
# mola_lidar_odometry/mola-cli-launchs/lidar_odometry_from_mulran.yaml) if you
# want to watch it live.
#
# Usage:
#   export MULRAN_BASE_DIR=/path/to/MulRan      # contains "<sequence>/sensor_data/..."
#   export MULRAN_SEQ=KAIST01                   # or DCC01, Riverside01, Sejong01, ...
#   mola-cli $(ros2 pkg prefix mola_mapper)/share/mola_mapper/mola-cli-launchs/lidar_odometry_mapper_from_mulran.yaml
# -----------------------------------------------------------------------------

modules:
  # =====================
  # MolaViz / MolaVizImGui
  # =====================
  - name: viz
    type: ${MOLA_GUI_MODULE|mola::MolaVizImGui}
    enabled: ${MOLA_WITH_GUI|true}
    verbosity_level: "${MOLA_VERBOSITY_MOLA_VIZ|INFO}"
    params:
      # Persist ImGui window layout/docking across runs (no-op for MolaViz).
      # Set to "" to disable persistence. Ignored by mola::MolaViz.
      imgui_app_name: mapper_mulran

  # =====================
  # MulranDataset
  # =====================
  - name: dataset_input
    type: mola::MulranDataset
    execution_rate: 20 # Hz
    quit_mola_app_on_dataset_end: ${MOLA_QUIT_ON_DATASET_END|true}

    params:
      base_dir: ${MULRAN_BASE_DIR}
      sequence: ${MULRAN_SEQ}
      time_warp_scale: ${MOLA_TIME_WARP|1.0}
      start_paused: ${MOLA_DATASET_START_PAUSED|false}
      publish_lidar: true
      # Toggle the auxiliary sensors to run ablations (e.g. LIO-only, LIO+IMU,
      # LIO+GNSS). For a "just IMU" run set MOLA_PUBLISH_GPS=false (and, since
      # geo-referencing needs GNSS, MOLA_ESTIMATE_GEO_REF=false).
      publish_gps: ${MOLA_PUBLISH_GPS|true}
      publish_imu: ${MOLA_PUBLISH_IMU|true}
      publish_ground_truth: true

  # =====================
  # LidarOdometry
  # =====================
  - name: lidar_odom
    type: mola::LidarOdometry
    verbosity_level: "${MOLA_VERBOSITY_MOLA_LO|INFO}"
    raw_data_source: "dataset_input"
    
    # This includes here a whole block "params: (...)"
    # with the LIDAR-Odometry pipeline configuration:
    # (mola_yaml `$import`: imported file is the base; siblings override it):
    # $define binds the ${VAR|default} hooks the imported pipeline exposes.
    # The mapper module owns the camera in this integrated launcher.
    $define:
      MOLA_GUI_CAMERA_FOLLOWS_VEHICLE: "false"
    $import: "${MOLA_ODOMETRY_PIPELINE_YAML|$(ros2 pkg prefix mola_lidar_odometry)/share/mola_lidar_odometry/pipelines/lidar3d-default.yaml}"
    params:
      visualization:
        show_ground_grid: false

  # =====================
  # mola_mapper (NavStateFilter + SharedKeyframeMap sink + direct IMU/GNSS)
  # =====================
  - name: mapper
    type: mola::mapper::Mapper
    verbosity_level: "${MOLA_VERBOSITY_MAPPER|INFO}"
    execution_rate: ${MOLA_MAPPER_RATE|50}  # Hz spinOnce rate: drives the high-rate publisher + smooth camera-follow
    # Subscribe directly to the dataset's IMU ("imu") and GNSS ("gps")
    # observations (lidar_odom's keyframes arrive separately, via the
    # SharedKeyframeMap sink, not through this subscription):
    raw_data_source: "dataset_input"

    params:
      # Import the shared defaults and override ONLY the MulRan-specific keys
      # (mola_yaml `$import`: imported file is the base; siblings override it):
      $import: ../params/mapper-common.yaml

      # MulRan has GNSS ("gps") + IMU ("imu") => estimate geo-referencing live.
      # This REQUIRES the gauge anchor too (otherwise the graph floats and iSAM2
      # throws until GNSS+IMU lock in; see the header comment).
      estimate_geo_reference: "${MOLA_ESTIMATE_GEO_REF|true}"
      link_first_pose_to_reference_origin_sigma: ${MOLA_LINK_FIRST_POSE_SIGMA|1e-6}

      # T_enu_to_map position sigma floors at the GNSS noise level (~1.1 m on
      # MulRan's standard-precision GNSS), so the common 1.0 m gate never latches;
      # 1.5 m gives margin. The geo-ref ORIENTATION converges to ~0.2 deg thanks
      # to the Xsens absolute-attitude factor, so the 5 deg gate clears quickly.
      convergence_max_position_sigma: ${MOLA_MAPPER_CONV_POS_SIGMA|1.5}

      # IMU gravity LEVELING of the central map (see agents.md "IMU gravity
      # leveling"). The filtered low-dynamics gravity factor (default on) only
      # levels the map if the otherwise near-rigid LIO orientation chain is made
      # compliant in roll/pitch; 3 deg lets gravity bend it back to level while
      # yaw stays pinned (no absolute yaw reference without GNSS). Validated on
      # DCC01 (gravity-factor chi2 ~16700 -> ~24, residual 2.2 -> 0.6 deg).
      odometry_edge_min_sigma_rollpitch_deg: ${MOLA_MAPPER_ODOM_RP_SIGMA|3.0}

      # Loop closure ON by default: MulRan urban sequences (DCC, KAIST,
      # Riverside) revisit places, so the mapper's background loop-closure
      # thread (mola_sm_loop_closure engine) cancels accumulated LiDAR-odometry
      # drift. Disable with MOLA_MAPPER_LOOP_CLOSURE=false. The pipeline below
      # is the mola_mapper wrapper (params/loop-closure-f2f-mapper.yaml) that
      # $imports the shared frame-to-frame GICP pipeline and widens the ICP
      # convergence basin; it uses the Ouster per-point timestamps to deskew each
      # keyframe scan. NOTE: cov2cov (GICP) loop detection is weak on Ouster data
      # (see ~/plans/lio-mulran-benchmarking.md), so on DCC01 few/no loops cross
      # the acceptance threshold; global accuracy here comes mainly from GNSS.
      loop_closure_enabled: ${MOLA_MAPPER_LOOP_CLOSURE|true}
      loop_closure_pipeline_file: "${MOLA_MAPPER_LC_PIPELINE|$(ros2 pkg prefix mola_mapper)/share/mola_mapper/params/loop-closure-f2f-mapper.yaml}"

      # MulRan's Xsens reports orientation already ENU-referenced (yaw measured
      # from East, Z-up), but emit_imu_factors_for_keyframe_locked() applies a
      # hardcoded Rz(90 deg) "azimuth wrt North" correction. For this Xsens that
      # over-rotates the absolute-attitude factor by 90 deg, so its implied
      # geo-ref yaw lands ~186 deg vs the GNSS-true ~102 deg (GT 98.4 deg). The
      # resulting ~84 deg conflict makes iSAM2 diverge (BayesTree errors,
      # trajectory blows up) whenever the attitude factor is on -- this is why a
      # default (or stiffer) MOLA_IMU_ATTITUDE_SIGMA "ruined" the result. Setting
      # -90 cancels the hardcoded +90. With it, the absolute-attitude factor both
      # levels the map (z-span 34 -> ~9 m) AND improves XY (APE-a 8.3 -> 6.7 m)
      # vs attitude-off, with geo-ref yaw 95 deg and zero solver errors on DCC01.
      # See ~/plans/lio-mulran-benchmarking.md (P11, 2026-07-01).
      imu_attitude_azimuth_offset_deg: ${MOLA_IMU_ATTITUDE_AZIMUTH_OFFSET|-90.0}

    # Optional visualization: the mapper owns the camera in this integrated
    # launcher (the LIO module's own camera-follow is turned off above), so it
    # tracks the vehicle by default (camera_follows_vehicle in the shared viz
    # defaults). Shared defaults (mola_yaml `$import`: imported file is the base):
    visualization:
      $import: ../params/mapper-visualization-common.yaml
