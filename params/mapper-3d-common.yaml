# ============================================================================
# Shared default parameters for mola::mapper_3d::Mapper3D
# ============================================================================
# This is a FLAT parameter fragment (no top-level `params:` wrapper) meant to be
# pulled in via the mola_yaml `$import` directive, so per-dataset launch files
# can share these defaults and override ONLY what differs, e.g.:
#
#   params:
#     $import: ../params/mapper-3d-common.yaml
#     estimate_geo_reference: true     # dataset-specific override
#
# (`$import`: the imported file is the base; the sibling keys override it.)
#
# Refer to:
# https://docs.mola-slam.org/latest/
# https://github.com/MOLAorg/mola_mapper_3d
# ============================================================================

# --------------------------------------------------------------------------
# Reference Frame IDs
# --------------------------------------------------------------------------
vehicle_frame_name: "${MOLA_TF_BASE_LINK|base_link}"
reference_frame_name: "${MOLA_TF_MAP|map}"
enu_frame_name: "enu"

# --------------------------------------------------------------------------
# Kinematic Model & Motion Factors
# --------------------------------------------------------------------------
# Options: KinematicModel::ConstantVelocity, KinematicModel::Tricycle
kinematic_model: "${MOLA_MAPPER3D_KINEMATIC_MODEL|KinematicModel::ConstantVelocity}"

max_time_to_use_velocity_model: ${MOLA_MAX_TIME_TO_USE_VELOCITY_MODEL|0.75}
min_time_difference_to_create_new_frame: 0.05
time_between_frames_to_warning: 3.0
gnss_nearby_keyframe_stamp_tolerance: 1.0

# Max rate [Hz] of summarized wheel-odometry increments inserted into the graph
# (0 = disabled = insert every reading); increments are merged (anchor held) up
# to this rate. NOTE: the IMU is NOT rate-capped here anymore: it never creates
# keyframes nor inserts per-sample factors. Every reading is accumulated in a
# LocalVelocityBuffer (lever-arm corrected) and the backend factors are built
# once per real keyframe, so the IMU factor rate equals the keyframe rate.
odometry_max_insert_rate_hz: ${MOLA_MAPPER3D_ODOM_MAX_RATE_HZ|5.0}

# High-rate IMU/wheels aggregation: do NOT spawn a keyframe per sample. Share a
# bounded-rate keyframe clock and aggregate wheels into relative-pose edges.
aggregate_high_rate_into_edges: ${MOLA_MAPPER3D_AGGREGATE|false}
sensor_keyframe_min_period: ${MOLA_MAPPER3D_SENSOR_KF_PERIOD|0.5}

# Keyframe-variable creation gating (plan 4.13 Phase A).
#   shared_map_only: only requestInsertKeyframe() creates KF graph variables (default).
#   auto:           legacy until first requestInsertKeyframe(); then shared_map_only.
#   sensor_clock:   sensor paths create KFs at sensor_clock_min_period_s rate.
keyframe_creation_source: "${MOLA_MAPPER3D_KF_CREATION|KeyframeCreationSource::SharedMapOnly}"
sensor_clock_min_period_s: ${MOLA_MAPPER3D_SENSOR_KF_CLOCK_S|0.5}

sigma_random_walk_acceleration_linear: ${MOLA_SIGMA_RW_LINACC|1.0}
sigma_random_walk_acceleration_angular: ${MOLA_SIGMA_RW_ANGACC|10.0}
sigma_integrator_position: 0.10
sigma_integrator_orientation: 1.0

initial_twist_sigma_lin: 20.0
initial_twist_sigma_ang: 3.0

enforce_planar_motion: ${MOLA_MAPPER3D_ENFORCE_PLANAR_MOTION|false}

# Pin the first frame to the reference origin (use 1e-6 for pure-odometry or
# when estimating geo-referencing; leave empty for pre-built geo-ref maps):
link_first_pose_to_reference_origin_sigma: ${MOLA_LINK_FIRST_POSE_SIGMA|}

# --------------------------------------------------------------------------
# IMU Related
# --------------------------------------------------------------------------
# Absolute-attitude factor sigma [deg] (0 disables). Added at every keyframe
# whenever the IMU reports an orientation quaternion, REGARDLESS of geo-ref: the
# absolute attitude is an azimuth reference, so it lets iSAM2 auto-estimate the
# geo-reference (T_enu_to_map yaw) even with GNSS off (the no-geo-ref F0 prior is
# yaw-free). Gravity leveling comes from the buffered-gravity factor below.
imu_attitude_sigma_deg: "${MOLA_IMU_ATTITUDE_SIGMA|2.0}"
imu_attitude_azimuth_offset_deg: "${MOLA_IMU_ATTITUDE_AZIMUTH_OFFSET|0.0}"
imu_angular_velocity_sigma_deg: ${MOLA_IMU_ANGVEL_SIGMA|0.0}

# IMU gravity-leveling reducer: the proper-acceleration samples accumulated
# between two keyframes are pooled, motion-contaminated ones rejected, and ONE
# MeasuredGravityFactor with a data-earned sigma is emitted on the keyframe.
imu_gravity_window_sec: ${MOLA_IMU_GRAVITY_WINDOW_SEC|1.0}
imu_gravity_accel_tol_frac: ${MOLA_IMU_GRAVITY_ACCEL_TOL|0.05}
imu_gravity_gyro_tol_deg: ${MOLA_IMU_GRAVITY_GYRO_TOL|3.0}
imu_gravity_min_samples: ${MOLA_IMU_GRAVITY_MIN_SAMPLES|10}
imu_gravity_sigma_floor_deg: ${MOLA_IMU_GRAVITY_SIGMA_FLOOR|0.5}
imu_gravity_sigma_ceil_deg: ${MOLA_IMU_GRAVITY_SIGMA_CEIL|5.0}

# --------------------------------------------------------------------------
# Geo-referencing
# --------------------------------------------------------------------------
estimate_geo_reference: "${MOLA_ESTIMATE_GEO_REF|false}"
gnss_huber_threshold: ${MOLA_GNSS_HUBER_THRESHOLD|1.5}
convergence_max_position_sigma: ${MOLA_MAPPER3D_CONV_POS_SIGMA|1.0}

# Consecutive-keyframe odometry-edge noise: derived from the PROPAGATED relative
# covariance of the source pose PDFs (anisotropic, like
# mola_sm_loop_closure::add_odometry_edges), so z/roll/pitch stay soft enough for
# IMU-gravity / GNSS to level the map. sigma = sqrt(diag) * multiplier + floor.
odometry_edge_uncertainty_multiplier: ${MOLA_ODOM_EDGE_MULT|1.0}
odometry_edge_min_sigma_xyz: ${MOLA_ODOM_EDGE_MIN_XYZ|0.01}
odometry_edge_min_sigma_ang_deg: ${MOLA_ODOM_EDGE_MIN_ANG|0.1}
convergence_max_orientation_sigma_deg: 5.0
publish_estimated_georef_on_convergence: true

# --------------------------------------------------------------------------
# Nonlinear Optimization
# --------------------------------------------------------------------------
additional_isam2_update_steps: 3

# Run the (growing) iSAM2 solve on a background thread so estimated_navstate()
# and the high-rate publisher return immediately from cached estimates.
enable_optimizer_thread: ${MOLA_MAPPER3D_OPTIMIZER_THREAD|true}

# --------------------------------------------------------------------------
# High-rate pose publisher
# --------------------------------------------------------------------------
high_rate_pose_publish_rate_hz: ${MOLA_MAPPER3D_PUBLISH_RATE_HZ|0.0}
high_rate_use_latest_sensors: true

# --------------------------------------------------------------------------
# Map save/load (single externalized .simplemap)
# --------------------------------------------------------------------------
load_simplemap_file: "${MOLA_MAPPER3D_LOAD_SM|}"
save_simplemap_file: "${MOLA_MAPPER3D_SAVE_SM|}"
externalize_after_seconds: 30.0

# --------------------------------------------------------------------------
# Sensor Input Filtering (Regex Patterns)
# --------------------------------------------------------------------------
do_process_imu_labels_re: "${MOLA_MAPPER3D_IMU_LABELS_RE|.*}"
do_process_odometry_labels_re: "${MOLA_MAPPER3D_ODOMETRY_LABELS_RE|.*}"
do_process_gnss_labels_re: "${MOLA_MAPPER3D_GNSS_LABELS_RE|.*}"

# --------------------------------------------------------------------------
# Output trajectory
# --------------------------------------------------------------------------
# If non-empty, save the estimated robot trajectory (in {reference_frame_name})
# as a TUM file at shutdown (and on demand via the GUI "Output" tab).
# Set MOLA_MAPPER3D_TUM_TRAJECTORY_OUTPUT to the desired path, or leave empty
# to skip (default).
save_trajectory_to_file: "${MOLA_MAPPER3D_TUM_TRAJECTORY_OUTPUT|}"
