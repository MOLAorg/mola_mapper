# ============================================================================
# Standalone configuration for mola::mapper::Mapper
# ============================================================================
# This is the whole-module config form, referenced from a launch file as:
#
#   - name: mapper3d
#     type: mola::mapper::Mapper
#     params: "../params/mapper-3d.yaml"
#
# It just `$import`s the shared parameter fragment (single source of truth) and
# adds the `visualization` block (a SIBLING of `params`, read separately by the
# module). Per-dataset launch files instead `$import: ../params/mapper-3d-common.yaml`
# directly under their own `params:` and override the few keys that differ.
#
# Refer to:
# https://docs.mola-slam.org/latest/
# https://github.com/MOLAorg/mola_mapper
# ============================================================================

params:
  $import: mapper-3d-common.yaml

# --------------------------------------------------------------------------
# Optional visualization (MolaViz / MolaVizImGui).
# --------------------------------------------------------------------------
# Renders the keyframe tree + graph edges in {map}, and repositions each
# odometry source's movable {odom_i} frame node (LidarOdometry draws its dense
# clouds / local map under it via render_in_movable_frame).
visualization:
  $import: mapper-3d-visualization-common.yaml
