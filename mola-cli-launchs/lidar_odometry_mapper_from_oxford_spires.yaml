# -----------------------------------------------------------------------------
#                        SLAM system definition for MOLA
# -----------------------------------------------------------------------------
# Integration: mola_mapper::Mapper acts as BOTH the `NavStateFilter`
# that `LidarOdometry` queries for short-term prediction AND the
# `SharedKeyframeMap` sink it pushes sparse central-map keyframes to.
#
# Dataset: Oxford Spires (https://dynamic.robots.ox.ac.uk/datasets/oxford-spires/)
# Read from a ROS 2 bag via mola::Rosbag2Dataset.
#
# Sensor inventory (from dataset calibration / rosbag2rawlog.yaml):
#   /hesai/pandar                  sensor_msgs/PointCloud2  Hesai PandarXT-32, ~10 Hz
#   /alphasense_driver_ros/imu     sensor_msgs/Imu          Alphasense IMU, ~200 Hz
# NO GNSS/GPS is published in the Oxford Spires bags; this launcher fuses
# LiDAR + IMU only. mapper3d's `estimate_geo_reference` stays at its default
# `false`.
#
# Sensor extrinsics (T_base_sensor, from rosbag2rawlog.yaml + dataset calib):
#   LiDAR: x=0, y=0, z=0.124 m, yaw=180 deg (Hesai mounted upside-down)
#   IMU:   x=-0.018, y=0.006, z=0.058 m, yaw=90 deg (Alphasense)
#
# Each Oxford Spires sequence may span multiple ROS 2 bag sub-folders (e.g.
# keble-college-01 has three). Rosbag2Dataset accepts a YAML sequence so you
# can pass all sub-folders at once; they are replayed in order. Example:
#
#   Single sub-folder (blenheim-palace-01 has only one):
#   export OXFORD_SPIRES_ROSBAG2=\
#     /mnt/storage/oxford-spires/data/sequences/2024-03-14-blenheim-palace-01/raw/ros2bag/1710406700_2024-03-14-08-58-21_0
#
#   Multiple sub-folders (keble-college-01 has three): override rosbag_filename
#   inline with a YAML sequence or set three separate env vars and join them in
#   a custom YAML snippet.
#
#   mola-cli $(ros2 pkg prefix mola_mapper)/share/mola_mapper/mola-cli-launchs/lidar_odometry_mapper_from_oxford_spires.yaml
#
# LOOP CLOSURE is ON by default here: the Oxford Spires sequences walk closed
# loops around Oxford colleges/quarters (revisiting the start and crossing prior
# passes), so the mapper's background loop-closure thread (mola_sm_loop_closure
# F2F engine) can cancel accumulated LiDAR-odometry drift. Disable with
# MOLA_MAPPER3D_LOOP_CLOSURE=false. The Hesai PandarXT-32 provides per-point
# timestamps, so the LC pipeline deskews normally (no ignore-no-timestamps flag).
#
# Recommended env vars (defaults already set for Oxford Spires below):
#   MOLA_DESKEW_METHOD=MotionCompensationMethod::IMU      (IMU-based deskew)
#   MOLA_LO_INITIAL_LOCALIZATION_METHOD=InitLocalization::PitchAndRollFromIMU
#   MOLA_WITH_GUI=false    for headless / batch runs
#   MOLA_TIME_WARP=N       to speed up (N>1) or slow down (N<1) playback
#   MOLA_QUIT_ON_DATASET_END=true  to exit automatically when the bag ends
#   MOLA_MAPPER3D_LOOP_CLOSURE=false  to disable loop closure
#   MOLA_MAPPER3D_TUM_TRAJECTORY_OUTPUT=/path.tum  to dump the trajectory
#
# The defaults above target real-time operation: a good trajectory at low
# compute (loop-closure candidates are restricted to nearby revisits, see
# params/loop-closure-f2f-mapper-oxford-spires.yaml).
#
# OPTIONAL OFFLINE REFINEMENT MODE (slower, denser, more accurate):
# loop closure can also be used as a map-refinement stage. It pays off only when
# BOTH the keyframe graph is dense AND loop-closure candidate generation is
# aggressive (either alone regresses). It is much heavier (thousands of ICP
# evaluations, mostly in the end-of-run finalize pass), so it is OFF by default
# and enabled by exporting this env-var bundle:
#   # denser LidarOdometry keyframes (the constraint-graph nodes):
#   MOLA_SIMPLEMAP_MIN_XYZ=1.5  MOLA_SIMPLEMAP_MIN_ROT=8
#   # aggressive nearby-loop candidate generation:
#   MIN_FRAMES_BETWEEN_LC=1  MAX_LC_CANDIDATES=400
#   LC_SELECTION_METHOD=PROXIMITY_ONLY  MAX_LC_DISTANCE=20
#   # more end-of-run refinement rounds:
#   MOLA_MAPPER3D_LC_FINALIZE_ROUNDS=15  MAX_LC_OPTIMIZATION_ROUNDS=15
# On observatory-quarter-01 this lifts the constraint graph to thousands of
# loop-closure edges and the best measured accuracy of the dataset.
# -----------------------------------------------------------------------------

modules:
  # =====================
  # MolaViz / MolaVizImGui
  # =====================
  - name: viz
    type: ${MOLA_GUI_MODULE|mola::MolaVizImGui}
    enabled: ${MOLA_WITH_GUI|true}
    verbosity_level: "${MOLA_VERBOSITY_MOLA_VIZ|INFO}"
    params:
      imgui_app_name: mapper3d_oxford_spires

  # =====================
  # Rosbag2Dataset (Oxford Spires)
  # =====================
  - name: dataset_input
    type: mola::Rosbag2Dataset
    verbosity_level: "${MOLA_VERBOSITY_ROSBAG2|INFO}"
    execution_rate: 50 # Hz
    quit_mola_app_on_dataset_end: ${MOLA_QUIT_ON_DATASET_END|true}

    gui_preview_sensors:
      - raw_sensor_label: lidar
        decimation: 1
        enabled: ${MOLA_WITH_GUI|true}
        win_pos: 5 5 400 400

    params:
      rosbag_filename: ${OXFORD_SPIRES_ROSBAG2}
      time_warp_scale: ${MOLA_TIME_WARP|1.0}
      start_paused: ${MOLA_DATASET_START_PAUSED|false}

      base_link_frame_id: base_link

      sensors:
        - topic: /hesai/pandar   # Hesai PandarXT-32, ~10 Hz
          type: CObservationPointCloud
          sensorLabel: lidar
          # Hesai is mounted inverted (yaw=180 deg) and lifted 12.4 cm above base_link:
          fixed_sensor_pose: "0.0 0.0 0.124 180 0 0" # 'x y z yaw_deg pitch_deg roll_deg'
          use_fixed_sensor_pose: true

        - topic: /alphasense_driver_ros/imu   # Alphasense IMU, ~200 Hz
          type: CObservationIMU
          sensorLabel: imu
          fixed_sensor_pose: "-0.018 0.006 0.058 90 0 0" # 'x y z yaw_deg pitch_deg roll_deg'
          use_fixed_sensor_pose: true

  # =====================
  # LidarOdometry
  # =====================
  - name: lidar_odom
    type: mola::LidarOdometry
    verbosity_level: "${MOLA_VERBOSITY_MOLA_LO|INFO}"
    raw_data_source: "dataset_input"

    $import: "${MOLA_ODOMETRY_PIPELINE_YAML|$(ros2 pkg prefix mola_lidar_odometry)/share/mola_lidar_odometry/pipelines/lidar3d-default.yaml}"
    params:
      # Oxford Spires uses the Alphasense IMU for deskewing and pitch/roll init:
      initial_localization:
        method: "${MOLA_LO_INITIAL_LOCALIZATION_METHOD|InitLocalization::PitchAndRollFromIMU}"
      observation_layers_deskew:
        method: "${MOLA_DESKEW_METHOD|MotionCompensationMethod::IMU}"
      visualization:
        show_ground_grid: false

  # =====================
  # mola_mapper (NavStateFilter + SharedKeyframeMap sink + direct IMU)
  # =====================
  - name: mapper3d
    type: mola::mapper::Mapper
    verbosity_level: "${MOLA_VERBOSITY_MAPPER3D|INFO}"
    # Subscribe directly to the dataset's IMU observations. LidarOdometry
    # keyframes arrive separately via the SharedKeyframeMap sink:
    raw_data_source: "dataset_input"

    params:
      $import: ../params/mapper-3d-common.yaml

      # MANDATORY gauge anchor: pure-odometry run (no GNSS). Without this the
      # graph floats and iSAM2 throws IndeterminantLinearSystemException.
      # estimate_geo_reference stays false (the common default).
      link_first_pose_to_reference_origin_sigma: ${MOLA_LINK_FIRST_POSE_SIGMA|1e-6}

      # Loop closure ON by default (see header). Same thin mola_mapper wrapper
      # the KITTI/MulRan launchers use: it $imports the shared f2f GICP pipeline
      # from mola_sm_loop_closure and only widens the ICP convergence basin so
      # real (drifted) loops close. Runs on a background thread off the
      # query/solve path; accepted edges merge as robust BetweenFactors.
      loop_closure_enabled: ${MOLA_MAPPER3D_LOOP_CLOSURE|true}
      # Dataset-specific LC pipeline: same shared mapper override, but with a
      # wider ICP final pairing sigma so the dense Hesai clouds' cross-pass
      # overlap scores above the acceptance gate (see the pipeline file's header).
      loop_closure_pipeline_file: "${MOLA_MAPPER3D_LC_PIPELINE|$(ros2 pkg prefix mola_mapper)/share/mola_mapper/params/loop-closure-f2f-mapper-oxford-spires.yaml}"

      # ~200 Hz IMU: buffer all readings in LocalVelocityBuffer and emit one
      # gravity/attitude/gyro factor set per keyframe (no per-sample factors).
      # aggregate_high_rate_into_edges is not needed here (no wheel odometry).
      high_rate_pose_publish_rate_hz: ${MOLA_MAPPER3D_PUBLISH_RATE_HZ|20.0}
