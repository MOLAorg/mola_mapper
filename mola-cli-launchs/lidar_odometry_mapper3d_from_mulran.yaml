# -----------------------------------------------------------------------------
#                        SLAM system definition for MOLA
# -----------------------------------------------------------------------------
# Integration validation: mola_mapper_3d::Mapper3D acts as BOTH the
# `NavStateFilter` that `LidarOdometry` queries for short-term prediction
# (replacing mola_state_estimation_{simple,smoother}) AND the
# `SharedKeyframeMap` sink it pushes sparse central-map keyframes to.
#
# Unlike the KITTI launcher (lidar_odometry_mapper3d_from_kitti.yaml), the
# MulRan dataset also provides IMU (with absolute orientation quaternion +
# magnetometer) and GNSS (NMEA GGA), both labeled "imu"/"gps". This file wires
# `mapper3d` directly to `raw_data_source: dataset_input` so it receives
# those observations via onNewObservation()/fuse_imu()/fuse_gnss(), in
# addition to the sparse keyframes pushed by LidarOdometry through the
# SharedKeyframeMap sink.
#
# The `params:` block below is inlined (NOT a reference to
# ../params/mapper-3d.yaml) because, unlike that shared default file, THIS
# launcher needs two non-default values active out of the box (no env var
# required for a first run):
#   - estimate_geo_reference: true -- otherwise fuse_gnss() silently ignores
#     every GNSS reading (no fixed_geo_reference is assumed for an arbitrary
#     sequence, so it must be estimated live from GNSS+IMU instead).
#   - link_first_pose_to_reference_origin_sigma: 1e-6 -- REQUIRED whenever
#     estimating geo-referencing (see Parameters.h's doc), or the whole graph
#     is gauge-free (~1e6-sigma absolute poses) until GNSS+IMU lock in, and
#     LidarOdometry discards the motion model meanwhile ("Discarding motion
#     model ... due to large uncertainty"), starving the local map and the
#     SharedKeyframeMap sink of updates.
# Everything else below mirrors ../params/mapper-3d.yaml; keep both in sync.
#
# No GUI module here on purpose (headless, for quick/automatable validation
# runs). Add a `viz: mola::MolaViz` module block (see
# mola_lidar_odometry/mola-cli-launchs/lidar_odometry_from_mulran.yaml) if you
# want to watch it live.
#
# Usage:
#   export MULRAN_BASE_DIR=/path/to/MulRan      # contains "<sequence>/sensor_data/..."
#   export MULRAN_SEQ=KAIST01                   # or DCC01, Riverside01, Sejong01, ...
#   mola-cli $(ros2 pkg prefix mola_mapper_3d)/share/mola_mapper_3d/mola-cli-launchs/lidar_odometry_mapper3d_from_mulran.yaml
# -----------------------------------------------------------------------------

modules:
  # =====================
  # MolaViz / MolaVizImGui
  # =====================
  - name: viz
    type: ${MOLA_GUI_MODULE|mola::MolaVizImGui}
    enabled: ${MOLA_WITH_GUI|true}
    verbosity_level: "${MOLA_VERBOSITY_MOLA_VIZ|INFO}"
    params:
      # Persist ImGui window layout/docking across runs (no-op for MolaViz).
      # Set to "" to disable persistence. Ignored by mola::MolaViz.
      imgui_app_name: mapper3d_mulran

  # =====================
  # MulranDataset
  # =====================
  - name: dataset_input
    type: mola::MulranDataset
    execution_rate: 20 # Hz
    quit_mola_app_on_dataset_end: ${MOLA_QUIT_ON_DATASET_END|true}

    params:
      base_dir: ${MULRAN_BASE_DIR}
      sequence: ${MULRAN_SEQ}
      time_warp_scale: ${MOLA_TIME_WARP|1.0}
      start_paused: ${MOLA_DATASET_START_PAUSED|false}
      publish_lidar: true
      publish_gps: true
      publish_imu: true
      publish_ground_truth: true

  # =====================
  # LidarOdometry
  # =====================
  - name: lidar_odom
    type: mola::LidarOdometry
    verbosity_level: "${MOLA_VERBOSITY_MOLA_LO|INFO}"
    raw_data_source: "dataset_input"
    # This includes here a whole block "params: (...)"
    # with the LIDAR-Odometry pipeline configuration:
    params: "${MOLA_ODOMETRY_PIPELINE_YAML|$(ros2 pkg prefix mola_lidar_odometry)/share/mola_lidar_odometry/pipelines/lidar3d-default.yaml}"

  # =====================
  # mola_mapper_3d (NavStateFilter + SharedKeyframeMap sink + direct IMU/GNSS)
  # =====================
  - name: mapper3d
    type: mola::mapper_3d::Mapper3D
    verbosity_level: "${MOLA_VERBOSITY_MAPPER3D|INFO}"
    # Subscribe directly to the dataset's IMU ("imu") and GNSS ("gps")
    # observations (lidar_odom's keyframes arrive separately, via the
    # SharedKeyframeMap sink, not through this subscription):
    raw_data_source: "dataset_input"

    params:
      # ------------------------------------------------------------------
      # Reference Frame IDs
      # ------------------------------------------------------------------
      vehicle_frame_name: "${MOLA_TF_BASE_LINK|base_link}"
      reference_frame_name: "${MOLA_TF_MAP|map}"
      enu_frame_name: "enu"

      # ------------------------------------------------------------------
      # Kinematic Model & Motion Factors
      # ------------------------------------------------------------------
      kinematic_model: "${MOLA_MAPPER3D_KINEMATIC_MODEL|KinematicModel::ConstantVelocity}"

      max_time_to_use_velocity_model: ${MOLA_MAX_TIME_TO_USE_VELOCITY_MODEL|0.75}
      min_time_difference_to_create_new_frame: 0.05
      time_between_frames_to_warning: 3.0
      gnss_nearby_keyframe_stamp_tolerance: 1.0
      imu_nearby_keyframe_stamp_tolerance: 0.10

      odometry_min_sample_period: ${MOLA_MAPPER3D_ODOM_MIN_PERIOD|0.0}
      imu_min_sample_period: ${MOLA_MAPPER3D_IMU_MIN_PERIOD|0.0}

      sigma_random_walk_acceleration_linear: ${MOLA_SIGMA_RW_LINACC|1.0}
      sigma_random_walk_acceleration_angular: ${MOLA_SIGMA_RW_ANGACC|10.0}
      sigma_integrator_position: 0.10
      sigma_integrator_orientation: 1.0

      initial_twist_sigma_lin: 20.0
      initial_twist_sigma_ang: 3.0

      enforce_planar_motion: ${MOLA_MAPPER3D_ENFORCE_PLANAR_MOTION|false}

      # REQUIRED while estimating geo-referencing (see header comment above):
      link_first_pose_to_reference_origin_sigma: ${MOLA_LINK_FIRST_POSE_SIGMA|1e-6}

      # ------------------------------------------------------------------
      # IMU Related (MulRan provides full orientation quaternion + accel +
      # gyro + magnetometer on the "imu" label)
      # ------------------------------------------------------------------
      imu_attitude_sigma_deg: "${MOLA_IMU_ATTITUDE_SIGMA|2.0}"
      imu_attitude_azimuth_offset_deg: "${MOLA_IMU_ATTITUDE_AZIMUTH_OFFSET|0.0}"
      imu_normalized_gravity_alignment_sigma: "${MOLA_IMU_GRAVITY_ALIGNMENT_SIGMA|0.4}"
      imu_angular_velocity_sigma_deg: ${MOLA_IMU_ANGVEL_SIGMA|0.0}

      # ------------------------------------------------------------------
      # Geo-referencing: ESTIMATED live from GNSS+IMU (the "gps" label, NMEA
      # GGA with per-fix ENU covariance). No fixed_geo_reference is assumed
      # since the sequence is not known ahead of time.
      # ------------------------------------------------------------------
      estimate_geo_reference: "${MOLA_ESTIMATE_GEO_REF|true}"
      gnss_huber_threshold: ${MOLA_GNSS_HUBER_THRESHOLD|1.5}
      convergence_max_position_sigma: 1.0
      convergence_max_orientation_sigma_deg: 5.0
      publish_estimated_georef_on_convergence: true

      # ------------------------------------------------------------------
      # Nonlinear Optimization
      # ------------------------------------------------------------------
      additional_isam2_update_steps: 3

      # ------------------------------------------------------------------
      # High-rate pose publisher
      # ------------------------------------------------------------------
      high_rate_pose_publish_rate_hz: ${MOLA_MAPPER3D_PUBLISH_RATE_HZ|0.0}
      high_rate_use_latest_sensors: true

      # ------------------------------------------------------------------
      # Map save/load (single externalized .simplemap)
      # ------------------------------------------------------------------
      load_simplemap_file: "${MOLA_MAPPER3D_LOAD_SM|}"
      save_simplemap_file: "${MOLA_MAPPER3D_SAVE_SM|}"
      externalize_after_seconds: 30.0

      # ------------------------------------------------------------------
      # Sensor Input Filtering (Regex Patterns): "imu" and "gps" labels match
      # the defaults already; tighten if other IMU/GNSS-like labels appear.
      # ------------------------------------------------------------------
      do_process_imu_labels_re: "${MOLA_MAPPER3D_IMU_LABELS_RE|.*}"
      do_process_odometry_labels_re: "${MOLA_MAPPER3D_ODOMETRY_LABELS_RE|.*}"
      do_process_gnss_labels_re: "${MOLA_MAPPER3D_GNSS_LABELS_RE|.*}"
