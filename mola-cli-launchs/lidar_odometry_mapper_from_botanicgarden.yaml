# -----------------------------------------------------------------------------
#                        SLAM system definition for MOLA
# -----------------------------------------------------------------------------
# Integration validation: mola_mapper::Mapper acts as BOTH the
# `NavStateFilter` that `LidarOdometry` queries for short-term prediction
# (replacing mola_state_estimation_{simple,smoother}) AND the
# `SharedKeyframeMap` sink it pushes sparse central-map keyframes to.
#
# Dataset: BotanicGarden (https://github.com/robot-pesg/BotanicGarden), read
# directly from its ROS 1 ".bag" file via mola::Rosbag1Dataset (no ROS 1
# install required). Sensor inventory of the "LIO" bag, confirmed with
# `rosbag1-info <bag>` (see mola_input_rosbag1/apps/rosbag1-info.cpp):
#   /imu/data         sensor_msgs/Imu        Xsens MTi-680G, ~400 Hz (base_link)
#   /livox/imu        sensor_msgs/Imu        BMI088 (Livox-built-in), ~200 Hz (unused here)
#   /velodyne_points  sensor_msgs/PointCloud2 Velodyne VLP-16, ~10 Hz
#   /livox/lidar      livox_ros_driver/CustomMsg  Livox AVIA, ~10 Hz (unused here)
#   /odom             nav_msgs/Odometry      wheel odometry, ~200 Hz
# NO GNSS/GPS topic exists in this bag (the Xsens has D-GNSS/INS hardware, but
# it is not published -- see ~/datasets/botanic/AGENTS.md). So this launcher
# fuses LiDAR + IMU + wheel odometry (the three available modalities), NOT
# GNSS. mapper's `estimate_geo_reference` stays at its default `false`.
#
# This launcher is SELF-CONTAINED: the safe defaults that mapper needs for
# this dataset are baked into its inline `params:` block below, so it runs out
# of the box with only BOTANICGARDEN_LIO_BAG + MOLA_ODOMETRY_PIPELINE_YAML set
# (every default is still overridable via the same env vars). Two of those
# defaults are NOT the ones in ../params/mapper.yaml and are mandatory here:
#
#  - `link_first_pose_to_reference_origin_sigma` (default 1e-6 here, empty in
#    the shared params file): fixes the graph gauge. Without it the whole graph
#    floats, iSAM2 throws gtsam::IndeterminantLinearSystemException a few
#    seconds in, and LidarOdometry then discards its motion model and dies.
#
#  - `odometry_max_insert_rate_hz` (default 5 Hz, in the shared params file too):
#    bounds the wheel-odometry (~200 Hz) input before it grows the graph. The IMU
#    (~400 Hz) is NO LONGER rate-capped: it never creates keyframes nor inserts
#    per-sample factors -- every reading is accumulated (lever-arm corrected) in a
#    LocalVelocityBuffer and the backend gravity/attitude/gyro factors are built
#    once per real keyframe, so the IMU factor rate equals the keyframe rate.
#    Unbounded 400+200 Hz used to grow the single, never-marginalized ISAM2 graph
#    (mapper_3d has no spatial paging yet -- see plan 4.11 / Phase 10) and slow
#    `estimated_navstate()` to a 174 ms average; the wheel cap + the keyframe-rate
#    IMU factors + the background optimizer thread keep it fast.
#
# BotanicGarden has no /tf or /tf_static: all sensor extrinsics below are
# `fixed_sensor_pose` values taken from
# BotanicGarden/calib/extrinsics/calib_chain.yaml (see
# mola_input_rosbag1/mola-cli-launchs/rosbag1_botanicgarden.yaml, which this
# file's sensor wiring mirrors), with the Xsens IMU (/imu/data) as base_link.
#
# Usage (works out of the box, no magic env vars needed):
#   export BOTANICGARDEN_LIO_BAG=$HOME/datasets/botanic/1018_00_LIO.bag
#   mola-cli $(ros2 pkg prefix mola_mapper)/share/mola_mapper/mola-cli-launchs/lidar_odometry_mapper_from_botanicgarden.yaml
#
# Optional: export BOTANICGARDEN_GT_BAG=$HOME/datasets/botanic/gt_1018_00_qnew.bag
#   to also replay /gt_poses (not consumed by mapper; for manual comparison
#   only). GUI is on by default (MOLA_WITH_GUI=false for headless).
#
# LOOP CLOSURE is ON by default here: the BotanicGarden sequences loop back
# through the garden paths, so the mapper's background loop-closure thread
# (mola_sm_loop_closure F2F engine) can cancel accumulated LiDAR-odometry
# drift. Disable with MOLA_MAPPER_LOOP_CLOSURE=false. The Velodyne VLP-16
# carries per-point timestamps (confirmed on the recorded PointCloud2 fields),
# so the LC pipeline deskews normally (no ignore-no-timestamps flag needed).
# -----------------------------------------------------------------------------

modules:
  # =====================
  # MolaViz / MolaVizImGui
  # =====================
  - name: viz
    type: ${MOLA_GUI_MODULE|mola::MolaVizImGui}
    enabled: ${MOLA_WITH_GUI|true}
    verbosity_level: "${MOLA_VERBOSITY_MOLA_VIZ|INFO}"
    params:
      imgui_app_name: mapper_botanicgarden

  # =====================
  # Rosbag1Dataset (BotanicGarden)
  # =====================
  - name: dataset_input
    type: mola::Rosbag1Dataset
    execution_rate: 50 # Hz
    quit_mola_app_on_dataset_end: ${MOLA_QUIT_ON_DATASET_END|true}

    gui_preview_sensors:
      - raw_sensor_label: lidar
        decimation: 1
        enabled: ${MOLA_WITH_GUI|true}
        win_pos: 5 5 400 400

    params:
      rosbag_filename:
        - ${BOTANICGARDEN_LIO_BAG}
        - ${BOTANICGARDEN_GT_BAG|}

      base_link_frame_id: xsens
      time_warp_scale: ${MOLA_TIME_WARP|1.0}
      start_paused: ${MOLA_DATASET_START_PAUSED|false}

      ground_truth_topic: /gt_poses

      sensors:
        - topic: /imu/data # Xsens MTi-680G, ~400 Hz: this IS base_link
          type: CObservationIMU
          sensorLabel: imu
          fixed_sensor_pose: "0 0 0 0 0 0"
          use_fixed_sensor_pose: true

        - topic: /velodyne_points # Velodyne VLP-16, ~10 Hz
          type: CObservationPointCloud
          sensorLabel: lidar
          fixed_sensor_pose: "0.0584868 0.0084042 0.1689155 -1.448155 0.097462 0.444791" # T_xsens_vlp16
          use_fixed_sensor_pose: true

        - topic: /odom # Wheel odometry, ~200 Hz
          type: CObservationOdometry
          sensorLabel: odom_wheels

        - topic: /gt_poses # Ground truth (only present if BOTANICGARDEN_GT_BAG is set)
          type: CObservationRobotPose
          sensorLabel: ground_truth

  # =====================
  # LidarOdometry
  # =====================
  - name: lidar_odom
    type: mola::LidarOdometry
    verbosity_level: "${MOLA_VERBOSITY_MOLA_LO|INFO}"
    raw_data_source: "dataset_input"

    # $define binds the variables that the imported
    # pipeline already exposes as ${VAR|default} hooks, so we retune its own
    # settings in place instead of restating the blocks that contain them.
    # Priority is `environment > $define > the pipeline's inline default`.
    $define:
      MOLA_DESKEW_METHOD: "MotionCompensationMethod::IMU"
      MOLA_LO_INITIAL_LOCALIZATION_METHOD: "InitLocalization::PitchAndRollFromIMU"
      MOLA_LOCAL_MAP_MAX_SIZE: "${MOLA_LOCAL_MAP_MAX_SIZE|20.0}" # smaller local LIO window than default since we have loop closure
      # The mapper module owns the camera in this integrated launcher.
      MOLA_GUI_CAMERA_FOLLOWS_VEHICLE: "false"

    $import: "${MOLA_ODOMETRY_PIPELINE_YAML|$(ros2 pkg prefix mola_lidar_odometry)/share/mola_lidar_odometry/pipelines/lidar3d-default.yaml}"

  # =====================
  # mola_mapper (NavStateFilter + SharedKeyframeMap sink + direct IMU/wheels)
  # =====================
  - name: mapper
    type: mola::mapper::Mapper
    verbosity_level: "${MOLA_VERBOSITY_MAPPER|INFO}"
    execution_rate: ${MOLA_MAPPER_RATE|50}  # Hz spinOnce rate: drives the high-rate publisher + smooth camera-follow
    # Subscribe directly to the dataset's IMU ("imu") and wheel-odometry
    # ("odom_wheels") observations (lidar_odom's keyframes arrive separately,
    # via the SharedKeyframeMap sink, not through this subscription):
    raw_data_source: "dataset_input"

    params:
      # Import the shared defaults and override ONLY the BotanicGarden-specific
      # keys (mola_yaml `$import`: imported file is the base; siblings override):
      $import: ../params/mapper-common.yaml

      # MANDATORY gauge anchor: this is a pure-odometry run (no GNSS), so without
      # it the graph floats and iSAM2 throws IndeterminantLinearSystemException
      # (see header). estimate_geo_reference stays false (the common default).
      link_first_pose_to_reference_origin_sigma: ${MOLA_LINK_FIRST_POSE_SIGMA|1e-6}

      # Loop closure ON by default (see header). Same thin mola_mapper wrapper
      # the KITTI/MulRan launchers use: it $imports the shared f2f GICP pipeline
      # from mola_sm_loop_closure and only widens the ICP convergence basin so
      # real (drifted) loops close. Runs on a background thread off the
      # query/solve path; accepted edges merge as robust BetweenFactors.
      loop_closure_enabled: ${MOLA_MAPPER_LOOP_CLOSURE|true}
      loop_closure_pipeline_file: "${MOLA_MAPPER_LC_PIPELINE|$(ros2 pkg prefix mola_mapper)/share/mola_mapper/params/loop-closure-f2f-mapper.yaml}"

      # ~400 Hz IMU + ~200 Hz wheels: aggregate the high-rate streams into
      # bounded-rate shared keyframes + relative edges (see header).
      aggregate_high_rate_into_edges: ${MOLA_MAPPER_AGGREGATE|true}

      # IMU preintegration (relative half): a CombinedImuFactor per keyframe
      # transition. Off by default; enable with MOLA_MAPPER_IMU_PREINT=true. Safe
      # here because LIO starts LEVEL (InitLocalization::PitchAndRollFromIMU
      # above), so {map} is gravity-aligned (Option B assumption).
      imu_preintegration_enabled: ${MOLA_MAPPER_IMU_PREINT|false}
      imu_preint_accel_noise_sigma: ${MOLA_MAPPER_IMU_PREINT_ACC_SIGMA|0.02}
      imu_preint_gyro_noise_sigma: ${MOLA_MAPPER_IMU_PREINT_GYR_SIGMA|0.0017}

      # Publish the extrapolated reference-frame pose at 20 Hz.
      high_rate_pose_publish_rate_hz: ${MOLA_MAPPER_PUBLISH_RATE_HZ|20.0}

    # Optional visualization: the mapper owns the camera in this integrated
    # launcher (the LIO module's own camera-follow is turned off above), so it
    # tracks the vehicle by default (camera_follows_vehicle in the shared viz
    # defaults). Shared defaults (mola_yaml `$import`: imported file is the base):
    visualization:
      $import: ../params/mapper-visualization-common.yaml
